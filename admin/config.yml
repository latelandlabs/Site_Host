backend:
  name: git-gateway
  branch: main

media_folder: "uploads"

collections:
  - name: "projects"
    label: "Projects"
    folder: "_projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "sub", widget: "string" }
      - { label: "Topics", name: "topics", widget: "select", multiple: true, options: ["video", "game", "event", "blog"] }
      - { label: "Kind", name: "kind", widget: "string", hint: "e.g. INTERACTIVE, RECURRING EVENT, TOUR" }
      - { label: "Background Image", name: "image", widget: "image", required: false }
      - { label: "Blurb", name: "blurb", widget: "text" }

  - name: "posts"
    label: "Blog Posts"
    folder: "_posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Kicker", name: "kicker", widget: "string", default: "BLOG" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Read Time", name: "read", widget: "string", default: "5 MIN READ" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Tags", name: "tags", widget: "list" }
      - { label: "Body", name: "body", widget: "markdown" }
