<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lateland</title>
<style>
  @font-face {
    font-family: "Rexlia";
    src: url("assets/rexlia.otf") format("opentype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --purple: #5a00ff;
    --purple-soft: #7a25ff;
    --purple-deep: #2a006d;
    --ink: #050007;
    --ink-2: #0c0014;
    --bone: #f4eeff;
    --line: rgba(244, 238, 255, 0.18);
    --bar-h: clamp(74px, 9.5vh, 110px);
    --bar-inset-x: clamp(20px, 5vw, 64px);
    --bar-inset-b: clamp(18px, 3.5vh, 36px);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--bone); }
  body {
    font-family: "Rexlia", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    letter-spacing: 0.02em;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; color: inherit; }
  a { color: inherit; }

  /* Ambient backdrop --------------------------------------------------- */
  .stage {
    position: fixed; inset: 0;
    background:
      radial-gradient(1200px 800px at 70% -10%, rgba(90, 0, 255, 0.18), transparent 60%),
      radial-gradient(900px 700px at -10% 110%, rgba(122, 37, 255, 0.14), transparent 60%),
      linear-gradient(180deg, #07000d 0%, #050007 60%, #02000a 100%);
    overflow: hidden;
  }
  .stars {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1.2px 1.2px at 12% 22%, rgba(255,255,255,0.45), transparent 60%),
      radial-gradient(1px 1px at 80% 18%, rgba(255,255,255,0.35), transparent 60%),
      radial-gradient(1.5px 1.5px at 55% 70%, rgba(200,180,255,0.4), transparent 60%),
      radial-gradient(1px 1px at 30% 80%, rgba(255,255,255,0.3), transparent 60%),
      radial-gradient(1px 1px at 92% 60%, rgba(255,255,255,0.25), transparent 60%),
      radial-gradient(1.2px 1.2px at 22% 55%, rgba(200,180,255,0.35), transparent 60%),
      radial-gradient(1px 1px at 67% 38%, rgba(255,255,255,0.3), transparent 60%);
    pointer-events: none;
    animation: twinkle 7s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 0.95; }
  }

  /* Loading screen ----------------------------------------------------- */
  #loader {
    position: fixed; inset: 0; z-index: 50;
    background: var(--ink);
    display: grid; place-items: center;
    transition: opacity 0.7s ease, visibility 0.7s;
  }
  #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .loader-stack { display: grid; place-items: center; gap: 28px; padding: 0 24px; text-align: center; }
  .loader-logo-wrap {
    width: clamp(180px, 30vmin, 300px); aspect-ratio: 1;
    position: relative;
    filter: drop-shadow(0 0 40px rgba(90,0,255,0.55));
  }
  .loader-logo-wrap img {
    width: 100%; height: 100%; object-fit: contain; display: block;
    opacity: 0; transform: scale(0.6) rotate(-25deg);
    animation: logoIn 2.1s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .loader-logo-wrap::after {
    content: "";
    position: absolute; inset: -10%;
    border-radius: 50%;
    border: 1px solid rgba(122, 37, 255, 0.45);
    opacity: 0;
    animation: ring 2.1s ease-out 0.2s forwards;
  }
  .loader-logo-wrap::before {
    content: "";
    position: absolute; inset: -22%;
    border-radius: 50%;
    border: 1px solid rgba(122, 37, 255, 0.22);
    opacity: 0;
    animation: ring 2.4s ease-out 0.45s forwards;
  }
  @keyframes logoIn {
    0%   { opacity: 0; transform: scale(0.55) rotate(-30deg); }
    55%  { opacity: 1; transform: scale(1.06) rotate(4deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes ring {
    0%   { opacity: 0; transform: scale(0.6); }
    60%  { opacity: 0.9; }
    100% { opacity: 0; transform: scale(1.4); }
  }
  .loader-wordmark {
    font-size: clamp(20px, 2.4vmin, 28px);
    letter-spacing: 0.55em;
    color: var(--bone);
    opacity: 0;
    animation: wordIn 0.9s ease-out 1.0s forwards;
    padding-left: 0.55em;
  }
  @keyframes wordIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 0.9; transform: none; }
  }
  .loader-bar {
    width: clamp(220px, 28vmin, 320px);
    height: 2px; background: rgba(244, 238, 255, 0.08);
    overflow: hidden; opacity: 0;
    animation: wordIn 0.6s ease-out 1.2s forwards;
  }
  .loader-bar > i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, transparent, var(--purple) 30%, var(--purple-soft) 70%, transparent);
    animation: barFill 1.6s cubic-bezier(.6,.2,.3,1) 1.1s forwards;
  }
  @keyframes barFill { to { width: 100%; } }

  /* Main app ----------------------------------------------------------- */
  #app {
    position: fixed; inset: 0;
    opacity: 0; transition: opacity 0.7s ease 0.1s;
  }
  #app.visible { opacity: 1; }

  .surface {
    position: absolute; inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 6vh 5vw calc(var(--bar-h) + var(--bar-inset-b) + 32px);
    scrollbar-width: thin;
    scrollbar-color: rgba(122, 37, 255, 0.45) transparent;
  }
  .surface.no-scroll { overflow: hidden; }
  .surface::-webkit-scrollbar { width: 8px; }
  .surface::-webkit-scrollbar-thumb { background: rgba(122,37,255,0.4); border-radius: 8px; }

  /* Page header (topic name + count) */
  .page-head {
    max-width: 1400px; margin: 0 auto 24px;
    display: flex; align-items: end; justify-content: space-between;
    min-height: 32px;
    padding: 0 8px;
  }
  .page-head.empty-head { min-height: 0; margin: 0; }
  .page-title {
    font-size: clamp(28px, 5vmin, 56px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin: 0;
    background: linear-gradient(180deg, #fff, #c9b6ff 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(122,37,255,0.25);
  }
  .page-count {
    font-size: 11px; letter-spacing: 0.4em; opacity: 0.55;
  }

  /* SLIDER ------------------------------------------------------------- */
  .slider-wrap {
    position: relative;
    max-width: 1400px;
    margin: 0 auto;
    height: calc(100vh - var(--bar-h) - var(--bar-inset-b) - 18vh);
    min-height: 420px;
    display: flex; align-items: center;
  }
  .slider-viewport {
    flex: 1; min-width: 0;
    overflow: hidden;
    padding: 24px 0;
  }
  .slider-track {
    display: flex;
    gap: clamp(16px, 2.2vw, 32px);
    transition: transform 0.6s cubic-bezier(.2,.7,.2,1);
    will-change: transform;
  }
  .slider-track .card {
    flex: 0 0 calc((100% - 2 * clamp(16px, 2.2vw, 32px)) / 3);
  }
  @media (max-width: 1000px) { .slider-track .card { flex-basis: calc((100% - clamp(16px, 2.2vw, 32px)) / 2); } }
  @media (max-width: 640px)  { .slider-track .card { flex-basis: 100%; } }

  .slider-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(10,0,20,0.7);
    backdrop-filter: blur(8px);
    color: var(--bone); cursor: pointer; z-index: 4;
    display: grid; place-items: center;
    transition: border-color 0.2s, color 0.2s, transform 0.2s, background 0.2s;
  }
  .slider-btn:hover:not(:disabled) { border-color: var(--purple-soft); color: var(--purple-soft); transform: translateY(-50%) scale(1.06); }
  .slider-btn:disabled { opacity: 0.25; cursor: default; }
  .slider-btn.prev { left: -16px; }
  .slider-btn.next { right: -16px; }
  .slider-btn svg { width: 18px; height: 18px; }
  @media (max-width: 700px) {
    .slider-btn.prev { left: 0; }
    .slider-btn.next { right: 0; }
  }

  .slider-dots {
    position: absolute; left: 0; right: 0;
    bottom: -22px;
    display: flex; justify-content: center; gap: 8px;
  }
  .slider-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(244,238,255,0.25);
    transition: background 0.2s, transform 0.2s;
  }
  .slider-dots span.on { background: var(--purple-soft); transform: scale(1.4); }

  /* Card ---------------------------------------------------------------- */
  .card {
    position: relative;
    aspect-ratio: 3 / 4;
    max-height: calc(100vh - var(--bar-h) - var(--bar-inset-b) - 20vh);
    border-radius: 14px;
    overflow: hidden;
    background: #1a0533;
    cursor: pointer;
    transform: translateY(12px) scale(0.985);
    opacity: 0;
    animation: cardIn 0.7s cubic-bezier(.2,.7,.2,1) forwards;
    transition: transform 0.45s cubic-bezier(.2,.7,.2,1), box-shadow 0.45s, filter 0.45s;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.05) inset,
      0 30px 60px -30px rgba(0,0,0,0.7),
      0 0 0 1px rgba(255,255,255,0.04);
  }
  .card.exit { animation: cardOut 0.45s cubic-bezier(.6,.2,.3,1) forwards; }
  .card:hover {
    transform: translateY(-3px) scale(1.005);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.06) inset,
      0 30px 60px -28px rgba(90, 0, 255, 0.3),
      0 0 0 1px rgba(122, 37, 255, 0.18);
  }
  @keyframes cardIn { to { opacity: 1; transform: none; } }
  @keyframes cardOut { to { opacity: 0; transform: translateY(20px) scale(0.96); } }

  .card .bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    transform: scale(1.06);
    transition: transform 0.8s ease;
    filter: saturate(0.95) contrast(1.02);
  }
  .card:hover .bg { transform: scale(1.08); }
  .card .scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.0) 35%, rgba(0,0,0,0.65) 100%),
      linear-gradient(180deg, rgba(10,0,20,0.25), transparent 30%);
  }
  .card .tags {
    position: absolute; top: 14px; right: 14px;
    display: flex; gap: 10px;
    z-index: 2;
  }
  .tag {
    width: 24px; height: 24px;
    background-color: #fff;
    -webkit-mask-position: center;  mask-position: center;
    -webkit-mask-size: contain;     mask-size: contain;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    transition: background-color 0.25s ease, filter 0.25s ease;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  }
  .tag.active { background-color: var(--purple-soft); filter: drop-shadow(0 0 6px rgba(122,37,255,0.8)); }
  .tag.video { -webkit-mask-image: url("assets/icon-video.svg"); mask-image: url("assets/icon-video.svg"); }
  .tag.game  { -webkit-mask-image: url("assets/icon-game.svg");  mask-image: url("assets/icon-game.svg"); }
  .tag.event { -webkit-mask-image: url("assets/icon-event.svg"); mask-image: url("assets/icon-event.svg"); }
  .tag.blog  { -webkit-mask-image: url("assets/icon-blog.svg");  mask-image: url("assets/icon-blog.svg"); }

  .card .logo {
    position: absolute; left: 22px; bottom: 22px; right: 22px;
    z-index: 2;
    color: #fff;
    font-size: clamp(20px, 2.4vw, 32px);
    line-height: 1.05;
    letter-spacing: 0.04em;
    text-shadow: 0 4px 18px rgba(0,0,0,0.55);
  }
  .card .logo small {
    display: block;
    font-size: 11px; letter-spacing: 0.35em;
    opacity: 0.75; margin-top: 6px;
    color: #d9c8ff;
  }

  /* Empty state */
  .empty {
    width: 100%;
    text-align: center; opacity: 0.5; letter-spacing: 0.3em; font-size: 12px;
    padding: 80px 12px;
  }

  /* Bottom bar (inset, floating) -------------------------------------- */
  .bar {
    position: fixed;
    left: var(--bar-inset-x); right: var(--bar-inset-x);
    bottom: var(--bar-inset-b);
    height: var(--bar-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 clamp(16px, 2.5vw, 28px);
    z-index: 30;
    background: transparent;
  }
  .bar-left, .bar-right { position: relative; display: flex; align-items: center; gap: clamp(8px, 1.4vw, 16px); }

  .home {
    display: grid; place-items: center;
    width: clamp(64px, 7vmin, 84px); height: clamp(64px, 7vmin, 84px);
    border: 0; background: transparent; cursor: pointer; padding: 0;
    position: relative;
    margin-right: 4px;
  }
  .home img { width: 100%; height: 100%; object-fit: contain; display: block;
    filter: drop-shadow(0 0 16px rgba(90,0,255,0.55));
    transition: transform 0.35s ease, filter 0.35s ease;
  }
  .home:hover img { transform: scale(1.06) rotate(-6deg); filter: drop-shadow(0 0 22px rgba(122,37,255,0.85)); }

  .navbtn {
    width: clamp(44px, 5vmin, 56px); height: clamp(44px, 5vmin, 56px);
    display: grid; place-items: center;
    border: 0; background: transparent; cursor: pointer; padding: 0;
    border-radius: 12px;
    transition: background 0.25s ease, transform 0.25s ease;
    position: relative;
  }
  .navbtn .ic {
    width: 62%; height: 62%;
    background-color: #fff;
    -webkit-mask-position: center;  mask-position: center;
    -webkit-mask-size: contain;     mask-size: contain;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    transition: background-color 0.25s ease, filter 0.25s ease;
  }
  .navbtn[data-topic="video"] .ic { -webkit-mask-image: url("assets/icon-video.svg"); mask-image: url("assets/icon-video.svg"); }
  .navbtn[data-topic="game"]  .ic { -webkit-mask-image: url("assets/icon-game.svg");  mask-image: url("assets/icon-game.svg");  }
  .navbtn[data-topic="event"] .ic { -webkit-mask-image: url("assets/icon-event.svg"); mask-image: url("assets/icon-event.svg"); }
  .navbtn[data-topic="blog"]  .ic { -webkit-mask-image: url("assets/icon-blog.svg");  mask-image: url("assets/icon-blog.svg");  }
  .navbtn:hover { background: rgba(122,37,255,0.12); transform: translateY(-2px); }
  .navbtn:hover .ic { background-color: #d9c8ff; }
  .navbtn.active .ic { background-color: var(--purple-soft); filter: drop-shadow(0 0 8px rgba(122,37,255,0.6)); }

  /* Tooltip — positioned ABOVE the bar, in its own layer */
  .navbtn .lbl {
    position: absolute; bottom: calc(100% + 14px); left: 50%;
    transform: translate(-50%, 4px);
    font-size: 10px; letter-spacing: 0.4em; padding: 6px 12px;
    background: rgba(10,0,20,0.95); border: 1px solid var(--line); border-radius: 999px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
    white-space: nowrap; color: var(--bone);
    z-index: 40;
  }
  .navbtn:hover .lbl { opacity: 1; transform: translate(-50%, 0); }

  .social {
    width: clamp(36px, 4.4vmin, 44px); height: clamp(36px, 4.4vmin, 44px);
    display: grid; place-items: center;
    border: 0; background: transparent; cursor: pointer; padding: 0;
    color: #fff; opacity: 0.85; text-decoration: none;
    transition: color 0.25s, opacity 0.25s, transform 0.25s;
  }
  .social:hover { color: var(--purple-soft); opacity: 1; transform: translateY(-2px); }
  .social svg { width: 22px; height: 22px; }

  /* When a topic is active, its label is pinned exactly where the hover
     tooltip would sit (above the icon) — same styling, same position. */
  .navbtn.active .lbl { opacity: 1; transform: translate(-50%, 0); }

  /* Sound toggle + back button at top right */
  .topbar {
    position: fixed; top: 18px; right: 18px; z-index: 31;
    display: flex; align-items: center; gap: 10px;
  }
  .sound-btn {
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    background: rgba(10,0,20,0.65);
    backdrop-filter: blur(8px);
    border-radius: 50%;
    color: var(--bone);
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s, background 0.2s;
  }
  .sound-btn:hover { color: var(--purple-soft); border-color: var(--purple-soft); }
  .sound-btn svg { width: 20px; height: 20px; }
  .sound-btn .sp-off { display: none; }
  .sound-btn.muted .sp-on { display: none; }
  .sound-btn.muted .sp-off { display: block; }
  .sound-btn.muted { color: #888; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 10px; letter-spacing: 0.4em;
    background: rgba(10,0,20,0.5);
    color: var(--bone); cursor: pointer;
    backdrop-filter: blur(6px);
  }
  .pill:hover { border-color: var(--purple-soft); color: var(--purple-soft); }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--purple); box-shadow: 0 0 10px var(--purple-soft); }
  .pill.muted .dot { background: #555; box-shadow: none; }

  /* Detail (game/event/video) — STATIONARY */
  .detail {
    position: fixed; inset: 0;
    background: var(--ink);
    z-index: 25;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
    overflow: hidden;
  }
  .detail.open { opacity: 1; pointer-events: auto; }
  .detail .bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    filter: brightness(0.45) saturate(1.05);
  }
  .detail .bg::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(2,0,10,0.92) 0%, rgba(2,0,10,0.55) 45%, transparent 65%),
      linear-gradient(0deg, rgba(2,0,10,0.85), transparent 55%);
  }
  .detail .body {
    position: relative; z-index: 1;
    max-width: 1400px; margin: 0 auto;
    padding: 10vh 5vw calc(var(--bar-h) + var(--bar-inset-b) + 32px);
    height: 100%;
    display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 6vw;
    align-content: center;
  }
  @media (max-width: 900px) { .detail .body { grid-template-columns: 1fr; } }
  .detail h1 {
    font-size: clamp(36px, 6.5vmin, 84px);
    line-height: 0.95;
    margin: 0 0 12px;
    letter-spacing: 0.04em;
  }
  .detail .sub {
    color: var(--purple-soft);
    letter-spacing: 0.32em; font-size: 12px; text-transform: uppercase;
    margin-bottom: 28px;
  }
  .detail p {
    color: rgba(244, 238, 255, 0.82);
    font-size: clamp(13px, 1.5vmin, 15px);
    line-height: 1.7;
    letter-spacing: 0.02em;
    max-width: 56ch;
  }
  .detail .chip {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 18px; margin-top: 22px;
    border: 1px solid var(--line); border-radius: 999px;
    font-size: 11px; letter-spacing: 0.4em;
    color: var(--bone);
  }
  .detail .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--purple); box-shadow: 0 0 12px var(--purple-soft); }
  .detail .close {
    position: absolute; top: 24px; right: 24px;
    width: 44px; height: 44px; border: 1px solid var(--line); background: rgba(10,0,20,0.6);
    border-radius: 50%; cursor: pointer; color: var(--bone); z-index: 3;
    display: grid; place-items: center;
    font-family: inherit; font-size: 18px;
  }
  .detail .close:hover { border-color: var(--purple-soft); color: var(--purple-soft); }

  /* BLOG list — reuses the home card/slider design */
  .card .meta {
    position: absolute; top: 14px; left: 18px; z-index: 2;
    font-size: 10px; letter-spacing: 0.4em; opacity: 0.8;
    color: #d9c8ff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }

  /* BLOG ARTICLE ------------------------------------------------------- */
  .article {
    max-width: 760px; margin: 0 auto;
    color: var(--bone);
  }
  .back-fixed {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 10px; letter-spacing: 0.4em;
    color: var(--bone); opacity: 0.85;
    border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 14px;
    background: rgba(10,0,20,0.65);
    backdrop-filter: blur(8px);
    font-family: inherit;
    cursor: pointer;
  }
  .back-fixed:hover { color: var(--purple-soft); border-color: var(--purple-soft); opacity: 1; }
  .article .hero {
    aspect-ratio: 16 / 7; border-radius: 16px; margin-bottom: 36px;
    background-size: cover; background-position: center;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.8);
  }
  .article .kicker {
    font-size: 11px; letter-spacing: 0.5em;
    color: var(--purple-soft); text-transform: uppercase;
    margin-bottom: 14px;
  }
  .article h1 {
    font-size: clamp(34px, 5.4vmin, 64px);
    line-height: 1.02;
    letter-spacing: 0.03em;
    margin: 0 0 18px;
    background: linear-gradient(180deg, #fff, #c9b6ff 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .article .byline {
    display: flex; gap: 18px; flex-wrap: wrap;
    font-size: 11px; letter-spacing: 0.35em; opacity: 0.6; text-transform: uppercase;
    margin-bottom: 36px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--line);
  }
  .article .body p,
  .article .body li {
    color: rgba(244, 238, 255, 0.82);
    font-size: 16px; line-height: 1.75;
    letter-spacing: 0.005em;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .article .body p { margin: 0 0 20px; text-wrap: pretty; }
  .article .body h2 {
    font-family: "Rexlia", sans-serif;
    font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase;

    body: `
      <p>We shipped <em>Office Therapy</em> on a Tuesday night in November, six rewrites and three publishing offers later. What follows isn't a victory lap — it's notes, scraped together while the launch is still warm.</p>
      <p>The pitch hasn't changed since the first jam build: you are a junior associate at a wellness-mandated firm, and the only way to get promoted is to attend a series of increasingly unhinged mandatory therapy sessions. Everything else changed. The art style changed twice. The soundtrack got an entire act removed. The narrative branched, then unbranched, then quietly grew a third ending we don't really talk about.</p>

      <h2>One color is not enough</h2>

const TOPIC_META = {
  all:   { word: "",        title: "" },
  video: { word: "VIDEOS",   title: "Videos"   },
  game:  { word: "GAMES",    title: "Games"    },

/* ------------------------------------------------------------------ */
/* RENDER — SLIDER (home) + filtered                                   */
/* ------------------------------------------------------------------ */
const track     = document.getElementById("slider-track");
const dotsEl    = document.getElementById("slider-dots");
const prevBtn   = document.getElementById("prev-btn");
const nextBtn   = document.getElementById("next-btn");
const surface   = document.getElementById("surface");

let activeTopic = "all";
let activeView  = "home";        // "home" | "blog" | "article"
let slideIndex  = 0;
let visiblePerSlide = 3;

function visibleCount() {
  if (window.matchMedia("(max-width: 640px)").matches) return 1;
  if (window.matchMedia("(max-width: 1000px)").matches) return 2;
  return 3;
}

function renderSlider() {
  visiblePerSlide = visibleCount();
  const list = (activeTopic === "all")
    ? PROJECTS.filter(p => p.topics.some(t => t !== "blog")) // home shows everything except blog-only
    : PROJECTS.filter(p => p.topics.includes(activeTopic));

  track.innerHTML = "";
  list.forEach((p, i) => {
    const el = document.createElement("article");
    el.className = "card";
    el.style.animationDelay = (i * 0.06) + "s";
    el.dataset.id = p.id;
    const tags = p.topics.map(t => {
      const cls = (t === activeTopic) ? " active" : "";
      return `<span class="tag ${t}${cls}"></span>`;
    }).join("");
    el.innerHTML = `
      <div class="bg" style="background-image: ${p.bg};"></div>
      <div class="scrim"></div>
      <div class="tags">${tags}</div>
      <div class="logo">${p.title.toUpperCase()}<small>${p.sub}</small></div>
    `;
    el.addEventListener("click", () => openDetail(p));
    track.appendChild(el);
  });

  if (list.length === 0) {
    track.innerHTML = '<div class="empty">— NO PROJECTS IN THIS CATEGORY YET —</div>';
  }

  // Dots
  const slides = Math.max(1, list.length - visiblePerSlide + 1);
  dotsEl.innerHTML = "";
  for (let i = 0; i < slides; i++) {
    const dot = document.createElement("span");
    dotsEl.appendChild(dot);
  }
  slideIndex = Math.min(slideIndex, slides - 1);
  if (slideIndex < 0) slideIndex = 0;
  updateSlider(list.length);
}
function updateSlider(total) {
  const slides = Math.max(1, total - visiblePerSlide + 1);
  // translate by one card-width per step
  const cardEl = track.querySelector(".card");
  if (cardEl) {
    const cardW = cardEl.offsetWidth;
    const gap = parseFloat(getComputedStyle(track).gap || "0");
    track.style.transform = `translateX(${-(cardW + gap) * slideIndex}px)`;
  }
  [...dotsEl.children].forEach((d, i) => d.classList.toggle("on", i === slideIndex));
  prevBtn.disabled = slideIndex <= 0;
  nextBtn.disabled = slideIndex >= slides - 1;
}
prevBtn.addEventListener("click", () => { slideIndex--; renderSlider(); playClick(); });
nextBtn.addEventListener("click", () => { slideIndex++; renderSlider(); playClick(); });
window.addEventListener("resize", () => renderSlider());

/* ------------------------------------------------------------------ */
/* VIEW SWITCHING                                                      */
/* ------------------------------------------------------------------ */
function showView(name) {
  activeView = name;
  document.getElementById("view-home").style.display    = (name === "home")    ? "" : "none";
  document.getElementById("view-blog").style.display    = (name === "blog")    ? "" : "none";
  document.getElementById("view-article").style.display = (name === "article") ? "" : "none";
  surface.classList.toggle("no-scroll", name !== "article");
  // Show inline back button (in topbar, left of sound icon) only on article view
  document.getElementById("back-to-blog").style.display = (name === "article") ? "" : "none";
  surface.scrollTo({ top: 0 });
}

function setTopic(t) {
  if (t === "blog") {
    activeTopic = "blog";
    showView("blog");
    renderBlogList();
    updateTopicChrome();
    return;
  }
  // Toggle off if already active
  if (t === activeTopic) {
    activeTopic = "all";
  } else {
    activeTopic = t;
  }
  showView("home");
  slideIndex = 0;
  renderSlider();
  updateTopicChrome();
}

function updateTopicChrome() {
  document.querySelectorAll(".navbtn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.topic === activeTopic);
  });
}

document.querySelectorAll(".navbtn").forEach(btn => {
  btn.addEventListener("click", () => {
    playClick();
    // Always close the detail overlay when the nav bar is clicked,
    // so users on a project page return to the topic feed.
    detail.classList.remove("open");
    setTopic(btn.dataset.topic);
  });
});
document.getElementById("home-btn").addEventListener("click", () => {
  playClick();
  detail.classList.remove("open");
  activeTopic = "all";
  slideIndex = 0;
  showView("home");
  renderSlider();
  updateTopicChrome();
});

/* ------------------------------------------------------------------ */
/* BLOG                                                                */
/* ------------------------------------------------------------------ */
let blogIndex = 0;
function renderBlogList() {
  const track = document.getElementById("blog-track");
  const dots  = document.getElementById("blog-dots");
  const prev  = document.getElementById("blog-prev");
  const next  = document.getElementById("blog-next");
  track.innerHTML = "";
  POSTS.forEach((p, i) => {
    const el = document.createElement("article");
    el.className = "card";
    el.style.animationDelay = (i * 0.06) + "s";
    el.innerHTML = `
      <div class="bg" style="background-image: ${p.hero};"></div>
      <div class="scrim"></div>
      <div class="meta">${p.date}</div>
      <div class="tags"><span class="tag blog active"></span></div>
      <div class="logo">${p.title.toUpperCase()}<small>${p.author} · ${p.read}</small></div>
    `;
    el.addEventListener("click", () => openPost(p));
    track.appendChild(el);
  });
  const vis = visibleCount();
  const slides = Math.max(1, POSTS.length - vis + 1);
  dots.innerHTML = "";
  for (let i = 0; i < slides; i++) dots.appendChild(document.createElement("span"));
  if (blogIndex >= slides) blogIndex = slides - 1;
  if (blogIndex < 0) blogIndex = 0;
  const updateBlog = () => {
    const cardEl = track.querySelector(".card");
    if (cardEl) {
      const cardW = cardEl.offsetWidth;
      const gap = parseFloat(getComputedStyle(track).gap || "0");
      track.style.transform = `translateX(${-(cardW + gap) * blogIndex}px)`;
    }
    [...dots.children].forEach((d, i) => d.classList.toggle("on", i === blogIndex));
    prev.disabled = blogIndex <= 0;
    next.disabled = blogIndex >= slides - 1;
  };
  prev.onclick = () => { blogIndex--; updateBlog(); playClick(); };
  next.onclick = () => { blogIndex++; updateBlog(); playClick(); };
  updateBlog();
}

function openPost(p) {
  showView("article");
  const root = document.getElementById("article-body");
  root.innerHTML = `
    <div class="hero" style="background-image: ${p.hero};"></div>
    <div class="kicker">${p.kicker}</div>
    <h1>${p.title}</h1>
    <div class="byline"><span>${p.author}</span><span>${p.date}</span><span>${p.read}</span></div>
    <div class="body">${p.body}</div>
    <div class="tags-row">${p.tags.map(t => `<span>${t.toUpperCase()}</span>`).join("")}</div>
    <div class="end">— ✦ —</div>
  `;
  playClick();
}
document.getElementById("back-to-blog").addEventListener("click", () => {
  playClick();
  showView("blog");
  renderBlogList();
});

const detail = document.getElementById("detail");
const detailBg = document.getElementById("detail-bg");
function openDetail(p) {
  detailBg.style.backgroundImage = p.bg;

  detail.classList.add("open");
  playClick();
}
document.getElementById("detail-close").addEventListener("click", () => { detail.classList.remove("open"); playClick(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") detail.classList.remove("open"); });

/* ------------------------------------------------------------------ */
/* AUDIO                                                               */
/* ------------------------------------------------------------------ */
let audioCtx = null;
let muted = false;
function ctx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playBrandSting() {
  if (muted) return;
  const ac = ctx();
  if (ac.state === "suspended") ac.resume();
  const now = ac.currentTime;
  const master = ac.createGain();
  master.gain.value = 0.0;
  master.gain.linearRampToValueAtTime(0.5, now + 0.05);
  master.gain.linearRampToValueAtTime(0.0, now + 2.4);
  master.connect(ac.destination);

  [0, 4, 7, 11].forEach((semi, i) => {
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = "sine";
    o.frequency.value = 220 * Math.pow(2, semi / 12);
    o.detune.value = (i - 1.5) * 6;
    g.gain.value = 0;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(0.07, now + 0.3 + i * 0.05);
    g.gain.linearRampToValueAtTime(0.0, now + 2.2);
    o.connect(g).connect(master);
    o.start(now); o.stop(now + 2.4);
  });

  const notes = [880, 1108.73, 1318.51, 1760, 1318.51, 880];
  notes.forEach((f, i) => {
    const t = now + 0.15 + i * 0.12;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = "triangle";
    o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.18, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    const f1 = ac.createBiquadFilter();
    f1.type = "lowpass"; f1.frequency.value = 4200;
    o.connect(f1).connect(g).connect(master);
    o.start(t); o.stop(t + 0.4);
  });

  const swell = ac.createOscillator();
  const swellG = ac.createGain();
  swell.type = "sawtooth";
  swell.frequency.setValueAtTime(110, now + 1.0);
  swell.frequency.exponentialRampToValueAtTime(330, now + 1.9);
  swellG.gain.setValueAtTime(0, now + 1.0);
  swellG.gain.linearRampToValueAtTime(0.12, now + 1.5);
  swellG.gain.linearRampToValueAtTime(0.0, now + 2.3);
  const bp = ac.createBiquadFilter();
  bp.type = "bandpass"; bp.Q.value = 1.2; bp.frequency.value = 800;
  swell.connect(bp).connect(swellG).connect(master);
  swell.start(now + 1.0); swell.stop(now + 2.4);
}
function playClick() {
  if (muted) return;
  const ac = ctx();
  if (ac.state === "suspended") ac.resume();
  const now = ac.currentTime;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = "triangle";
  o.frequency.setValueAtTime(880, now);
  o.frequency.exponentialRampToValueAtTime(1760, now + 0.08);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.08, now + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
  o.connect(g).connect(ac.destination);
  o.start(now); o.stop(now + 0.2);
}
document.getElementById("sound-pill").addEventListener("click", () => {
  muted = !muted;
  document.getElementById("sound-pill").classList.toggle("muted", muted);
  if (!muted) ctx().resume?.();
});
document.getElementById("back-to-blog").addEventListener("click", () => {
  playClick();
  showView("blog");
  renderBlogList();
});
